    <script>
      (() => {
        const root = document.documentElement
        let appReady = false
        let fallbackTimer
        const detachFallback = () => {
          window.clearTimeout(fallbackTimer)
          window.removeEventListener('error', onError, true)
          window.removeEventListener('unhandledrejection', restoreNavigation)
          window.removeEventListener('infranest-app-ready', markAppReady)
        }
        const restoreNavigation = () => {
          if (appReady) return
          root.removeAttribute('data-enhanced')
          detachFallback()
        }
        const markAppReady = () => {
          appReady = true
          detachFallback()
        }
        const onError = (event) => {
          if (event.target === window || event.target instanceof HTMLScriptElement) restoreNavigation()
        }
        root.dataset.enhanced = 'true'
        window.addEventListener('error', onError, true)
        window.addEventListener('unhandledrejection', restoreNavigation)
        window.addEventListener('infranest-app-ready', markAppReady)
        fallbackTimer = window.setTimeout(restoreNavigation, 5000)
      })()
    </script>
